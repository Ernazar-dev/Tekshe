# Render Blueprint: GitHub repo dan eki xızmetti bir basıw menen jaratadı.
# Render -> New -> Blueprint -> usı repo. Sırlar (sync: false) Render panelinde kiritiledi.
services:
  # ───────── Backend API (Node / Express) ─────────
  - type: web
    name: tekshe-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    # devDependencies (typescript) build ushın kerek — Render NODE_ENV=production qoyǵanı ushın --include=dev
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      # Neon pooled connection URL (sslmode=require)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Frontend mánzili (mısalı https://tekshe-web.onrender.com) — frontend jaratılǵannan keyin kiritiledi
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_LOGIN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ───────── Frontend (React / Vite, statik sayt) ─────────
  - type: web
    name: tekshe-web
    runtime: static
    region: frankfurt
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22
      # Backend mánzili + /api (mısalı https://tekshe-api.onrender.com/api)
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA: barlıq marshrutlar index.html ge qaytadı
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
